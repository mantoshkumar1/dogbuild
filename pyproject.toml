[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dogbuild"
version = "0.0.0"
description = "Local, governed project interface for coordinating coding agents."
readme = "README.md"
requires-python = ">=3.9"
# Runtime: standard library only (zero third-party runtime dependencies) by design.
dependencies = []

[project.optional-dependencies]
# Tests use the stdlib `unittest` runner; no third-party test dependency required.
dev = []

[project.scripts]
statekeeper = "psk.__main__:main"
dogbuild = "psk.__main__:main"
psk = "psk.__main__:main"

[tool.setuptools]
packages = ["psk"]

[tool.setuptools.package-data]
psk = ["schemas/*.json", "policies/*.yaml", "skills/dogbuild/*.md"]
